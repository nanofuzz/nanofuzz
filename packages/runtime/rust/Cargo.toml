[package]
name = "nanofuzz-runtime"
version = "0.4.0"
edition = "2021"
description = "Runtime support and types for NaNofuzz test suites and property validators in Rust"
license = "MIT"
repository = "https://github.com/nanofuzz/nanofuzz"
authors = ["The NaNofuzz Team at Carnegie Mellon University"]
readme = "README.md"
keywords = ["fuzzing", "testing", "property-testing", "nanofuzz"]
categories = ["development-tools::testing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

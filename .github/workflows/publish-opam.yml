name: Publish opam Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.4.0)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (simulate without publishing to GitHub or opam-repository)"
        type: boolean
        required: false
        default: true

jobs:
  publish-opam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0

      - name: Install dependencies
        run: |
          opam install dune yojson msgpck ounit2 dune-release opam-publish -y

      - name: Add OCaml switch to GITHUB_PATH
        run: |
          opam var bin >> "$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$(opam var prefix)" >> "$GITHUB_ENV"

      - name: Test runtime package
        working-directory: packages/runtime/oxcaml
        run: dune runtest

      - name: Validate opam package
        working-directory: packages/runtime/oxcaml
        run: opam lint nanofuzz_runtime.opam

      - name: Clean build artifacts
        working-directory: packages/runtime/oxcaml
        run: dune clean

      - name: Publish to opam-repository
        working-directory: packages/runtime/oxcaml
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi

          TAG_ARG=""
          if [ -n "$TAG" ]; then
            TAG_ARG="--tag $TAG"
          fi

          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
            echo "Running in DRY RUN mode (simulating without creating GitHub release or opam PR)"
          fi

          # Use dune-release to generate release tarball and submit PR to ocaml/opam-repository
          if [ -n "${{ secrets.OPAM_PUBLISH_TOKEN }}" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            dune-release distrib $TAG_ARG $DRY_RUN_ARG --skip-lint --skip-build --skip-tests
            dune-release publish distrib $TAG_ARG $DRY_RUN_ARG --yes
            dune-release opam pkg $TAG_ARG $DRY_RUN_ARG
            dune-release opam submit $TAG_ARG $DRY_RUN_ARG --yes --no-auto-open
          else
            echo "Notice: OPAM_PUBLISH_TOKEN not set. Skipping PR submission to ocaml/opam-repository."
          fi
        env:
          DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.OPAM_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

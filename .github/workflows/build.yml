name: Build
on:
  pull_request:
  push:
    branches:
      - main
defaults:
  run:
    shell: bash
jobs:
  buildandtest:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      # Infrastructure setup
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NaNofuzz Environment
        uses: ./.github/actions/setup-nanofuzz

      # Visual Studio Code Extension
      - name: NaNofuzz vscode extension
        run: |
          yarn build
          yarn test
          yarn package

      # npm runtime package
      - name: NaNofuzz runtime (typescript)
        working-directory: packages/runtime/typescript
        run: |
          yarn
          yarn build
          yarn test
          yarn package

      # pip runtime package
      - name: NaNofuzz runtime (python)
        working-directory: packages/runtime/python
        run: |
          python prebuild.py
          python -m build
          pytest
          twine check dist/*

      # cargo runtime crate
      - name: NaNofuzz runtime (rust)
        working-directory: packages/runtime/rust
        run: |
          cargo test

      # opam runtime library
      - name: NaNofuzz runtime (oxcaml)
        if: runner.os != 'Windows'
        working-directory: packages/runtime/oxcaml
        run: |
          dune runtest

      # maven runtime package
      - name: NaNofuzz runtime (java)
        working-directory: packages/runtime/java
        run: |
          mvn clean test

      # go runtime package
      - name: NaNofuzz runtime (go)
        working-directory: packages/runtime/go
        run: |
          go test -v ./...
